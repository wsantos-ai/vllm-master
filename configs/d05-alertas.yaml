# D-05 — Alertas do serviço no Prometheus do cluster (PD-38). Autorizado pelo administrador em 2026-11-10 (liberou o
#   estudo para mexer no ambiente).
#
# Aplicado pelo Bloco A de runbooks/observabilidade-d05.md. O Prometheus só carrega PrometheusRule com o rótulo que o
#   ruleSelector dele pede (o bloco confere antes; padrão do kube-prometheus-stack: release: monitoring, como os
#   ServiceMonitor, AC-38). Métricas e rótulos conferidos no Prometheus em 2026-11-10 (AC-39, AC-40; Bloco G).
# Os alertas aparecem no Prometheus (/alerts), no Alertmanager e no Grafana (Alerting). Mandar e-mail ou mensagem
#   depende de um receiver no Alertmanager, que hoje não está configurado pelo estudo.
#
# De onde vêm os limiares (mude aqui e reaplique; cada um é ponto de partida, não medida de falha):
#   - fila, KV cache, preempções, latência: AC-31 (Nemo, 1 GPU, 32 usuários simultâneos com as perguntas reais):
#     fila máx 0, KV cache máx 0,34, preempções +0, p95 por pergunta 25,0 s (consulta + resposta, sem streaming);
#   - clock e temperatura: AC-17 (estrangulamento: SM de 1560 para ~400 MHz em 2 min, começando em 82 °C; 72 °C parada);
#   - Kong: proporção de 5xx e 429 sustentados são escolha de operação, sem medida no estudo.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: d05-alertas
  namespace: vllms
  labels: {decisao: d-05, release: monitoring}
spec:
  groups:
  - name: d05-vllm
    rules:
    - alert: D05VllmReplicaFora
      expr: (count(up{namespace="vllms"} == 1) or vector(0)) < 3
      for: 3m
      labels: {severity: critical, decisao: d-05}
      annotations:
        summary: "vLLM com menos de 3 réplicas respondendo ao Prometheus"
        description: "{{ $value }} de 3 réplicas do vllm-server com /metrics de pé. Veja kubectl get pods -n vllms."
    - alert: D05VllmFila
      expr: max by (pod) (vllm:num_requests_waiting{namespace="vllms"}) > 0
      for: 5m
      labels: {severity: warning, decisao: d-05}
      annotations:
        summary: "Réplica {{ $labels.pod }} com requisições na fila há 5 min"
        description: "Na fila agora: {{ $value }}. Com 32 usuários por GPU a fila ficou em 0 (AC-31): a carga passou disso."
    - alert: D05VllmKvCacheAlto
      expr: max by (pod) (vllm:kv_cache_usage_perc{namespace="vllms"}) > 0.8
      for: 5m
      labels: {severity: warning, decisao: d-05}
      annotations:
        summary: "KV cache de {{ $labels.pod }} acima de 80% há 5 min"
        description: "Ocupação {{ $value | humanizePercentage }}; com 32 usuários o máximo foi 34% (AC-31)."
    - alert: D05VllmPreempcoes
      expr: sum by (pod) (increase(vllm:num_preemptions_total{namespace="vllms"}[10m])) > 0
      for: 0m
      labels: {severity: warning, decisao: d-05}
      annotations:
        summary: "Réplica {{ $labels.pod }} tirou requisições da GPU por falta de KV cache"
        description: "{{ $value }} preempções em 10 min; com 32 usuários foram 0 (AC-31). As requisições ficam mais lentas."
    - alert: D05VllmLatenciaAlta
      expr: >-
        histogram_quantile(0.95, sum by (le) (rate(vllm:e2e_request_latency_seconds_bucket{namespace="vllms"}[10m])))
        > 25
      for: 10m
      labels: {severity: warning, decisao: d-05}
      annotations:
        summary: "p95 da latência do vLLM acima de 25 s há 10 min"
        description: "p95 = {{ $value | humanizeDuration }}. 25 s foi o p95 de uma pergunta inteira (2 chamadas) com 32 usuários (AC-31)."
  - name: d05-gpu
    rules:
    - alert: D05GpuEstrangulada
      expr: (DCGM_FI_DEV_SM_CLOCK{namespace="gpu-operator"} < 1000) and (DCGM_FI_DEV_GPU_UTIL{namespace="gpu-operator"} > 50)
      for: 2m
      labels: {severity: critical, decisao: d-05}
      annotations:
        summary: "GPU de {{ $labels.Hostname }} trabalhando com clock baixo"
        description: "SM a {{ $value }} MHz com a GPU ocupada. Em AC-17 o estrangulamento térmico levou o SM de 1560 a ~400 MHz e a vazão caiu 4×. Confira com nvidia-smi -q -d PERFORMANCE."
    - alert: D05GpuQuente
      expr: DCGM_FI_DEV_GPU_TEMP{namespace="gpu-operator"} > 80
      for: 5m
      labels: {severity: warning, decisao: d-05}
      annotations:
        summary: "GPU de {{ $labels.Hostname }} acima de 80 °C há 5 min"
        description: "{{ $value }} °C. Em AC-17 o estrangulamento começou a 82 °C."
    - alert: D05GpuSemMetricas
      expr: (count(up{namespace="gpu-operator"} == 1) or vector(0)) < 3
      for: 5m
      labels: {severity: warning, decisao: d-05}
      annotations:
        summary: "DCGM respondendo em menos de 3 nós"
        description: "{{ $value }} de 3. Sem isso, os alertas de GPU não disparam."
  - name: d05-kong
    rules:
    - alert: D05KongErros5xx
      expr: >-
        sum(rate(kong_http_requests_total{code=~"5.."}[5m])) / sum(rate(kong_http_requests_total[5m])) > 0.05
        and sum(rate(kong_http_requests_total[5m])) > 0.1
      for: 5m
      labels: {severity: critical, decisao: d-05}
      annotations:
        summary: "Mais de 5% de respostas 5xx na rota do vLLM"
        description: "Proporção {{ $value | humanizePercentage }}. 502/503: o Kong não alcança o vLLM; 504: o vLLM passou de 120 s."
    - alert: D05KongLimiteDoAtor
      expr: sum by (consumer) (rate(kong_http_requests_total{code="429"}[5m])) > 0
      for: 10m
      labels: {severity: warning, decisao: d-05}
      annotations:
        summary: "Ator {{ $labels.consumer }} batendo no limite de requisições há 10 min"
        description: "{{ $value }} respostas 429 por segundo. Ou o ator precisa de limite maior (d05-rate-limit), ou há uso fora do previsto."
    - alert: D05KongSemMetricas
      expr: (count(up{namespace="kong"} == 1) or vector(0)) < 1
      for: 5m
      labels: {severity: warning, decisao: d-05}
      annotations:
        summary: "Prometheus sem métricas do Kong"
        description: "O PodMonitor d05-kong não alcança a porta 8100 do gateway. Os alertas do Kong não disparam."
