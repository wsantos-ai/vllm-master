# 13. LEITURA ATIVA\r
\r
Ao terminar o resumo, responda:\r
\r
### O que agora consigo explicar?\r
\r
### O que agora consigo fazer?\r
\r
### Que decisão eu tomaria diferente?\r
\r
### Que oportunidade consigo enxergar que antes não enxergava?\r
\r
### Que hipótese deveria testar?\r
\r
### O que ainda não sei?\r
\r
---\r
\r
# 14. BANCO CUMULATIVO DE CONHECIMENTO\r
\r
Cada livro deve ser tratado como parte de uma biblioteca intelectual cumulativa.\r
\r
Ao analisar um novo livro, procure:\r
\r
* confirmar princípios anteriores;\r
* contradizer princípios anteriores;\r
* aprofundar conceitos;\r
* apresentar novas perspectivas;\r
* preencher lacunas;\r
* revelar contradições.\r
\r
Não trate cada livro como conhecimento isolado.\r
\r
---\r
\r
# 15. REGRA CONTRA O RESUMO SUPERFICIAL\r
\r
Não transforme o livro em uma lista de tópicos.\r
\r
Explique:\r
\r
**causa → mecanismo → consequência → aplicação.**\r
\r
Quero compreender **por que** uma ideia funciona, e não apenas saber **qual** é a ideia.\r
\r
---\r
\r
# 16. REGRA CONTRA O "RICH-WASHING"\r
\r
Não tente transformar qualquer conceito em uma oportunidade de negócio.\r
\r
Uma oportunidade só deve ser apresentada quando existir uma conexão plausível entre:\r
\r
**problema → cliente → valor → solução → modelo econômico.**\r
\r
Se não houver, diga:\r
\r
> "Este conceito não apresenta, neste momento, uma oportunidade evidente de aplicação econômica em software ou IA."\r
\r
---\r
\r
# 17. REGRA CONTRA O "AI-WASHING"\r
\r
Não presuma que adicionar IA torna uma ideia melhor.\r
\r
Pergunte:\r
\r
> **"A IA realmente cria valor aqui?"**\r
\r
Considere:\r
\r
* custo;\r
* precisão;\r
* confiabilidade;\r
* experiência do usuário;\r
* alternativas;\r
* vantagem competitiva;\r
* disposição a pagar.\r
\r
---\r
\r
# 18. RESULTADO FINAL\r
\r
O produto final de cada livro não deve ser apenas um resumo.\r
\r
Deve ser:\r
\r
**Resumo + Aula + Modelos Mentais + Princípios + Crítica + Aplicações + Oportunidades + Experimentos + Perguntas + Conexões.**\r
\r
O objetivo é que cada livro aumente minha capacidade de:\r
\r
**pensar → criar valor → gerar renda → construir patrimônio → investir → alcançar independência financeira.**\r
\r
---\r
\r
# 19. PRINCÍPIO FINAL\r
\r
Não estou estudando livros para terminar livros.\r
\r
Estou estudando livros para construir um **sistema de conhecimento e tomada de decisão** capaz de transformar meu capital intelectual em criação de valor, renda e patrimônio.\r
\r
A pergunta mais importante ao final de cada livro é:\r
\r
> **"Depois de estudar este livro, o que eu consigo enxergar, compreender ou fazer que antes não conseguia?"**\r
\r
---\r
\r
# 20. ONDE SALVAR E O QUE CONSULTAR\r
\r
Antes de resumir, leia:\r
\r
* `02-conhecimento/biblioteca.md` — por que o livro está na fila e em qual fase;\r
* `02-conhecimento/modelos-mentais.md`, `02-conhecimento/principios.md` e `02-conhecimento/conexoes-entre-livros.md` — para conectar o livro ao conhecimento acumulado (seção 14);\r
* os resumos existentes em `02-conhecimento/livros/` que tratem de temas próximos.\r
\r
Salve o resumo em `02-conhecimento/livros/sobrenome-autor--titulo-curto.md` (minúsculas, sem acentos).\r
\r
Ao final da resposta, liste as atualizações sugeridas para `modelos-mentais.md`, `principios.md`, `conexoes-entre-livros.md` e `03-oportunidades/banco-de-oportunidades.md`, para que sejam revisadas antes de entrar no banco cumulativo."""
