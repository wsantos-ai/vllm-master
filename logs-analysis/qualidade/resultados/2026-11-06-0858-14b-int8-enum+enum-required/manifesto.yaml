# Teste de qualidade, 1 GPU em sabdiia01. vLLM v0.19.1. Pod de teste (restartPolicy Never), apagado no fim.
# Sem Service: a coleta roda dentro do pod, em 127.0.0.1:8000.
apiVersion: v1
kind: Pod
metadata: {name: vllm-qual, namespace: vllm-estudo, labels: {app: vllm-qual, teste: qualidade}}
spec:
  nodeSelector: {kubernetes.io/hostname: sabdiia01}
  restartPolicy: Never
  containers:
  - name: vllm
    image: vllm/vllm-openai:v0.19.1
    command: ["/bin/bash", "-c"]
    args:
    - |
      set -e
      python3 -c "from huggingface_hub import snapshot_download as s; print('pesos em', s('Qwen/Qwen2.5-14B-Instruct-GPTQ-Int8', local_files_only=True))" || HF_HUB_OFFLINE=0 python3 -c "from huggingface_hub import snapshot_download as s; print('pesos em', s('Qwen/Qwen2.5-14B-Instruct-GPTQ-Int8', allow_patterns=['*.safetensors','*.json','*.model','*.txt','*.tiktoken','*.py']))"
      exec vllm serve Qwen/Qwen2.5-14B-Instruct-GPTQ-Int8 --dtype float16 --max-model-len 8192 --gpu-memory-utilization 0.90 --generation-config vllm --enable-auto-tool-choice --tool-call-parser hermes --host 0.0.0.0 --port 8000
    env:
    - {name: HF_HOME, value: /hf-cache}
    - {name: HF_HUB_OFFLINE, value: "1"}
    readinessProbe:
      httpGet: {path: /health, port: 8000}
      periodSeconds: 10
    resources:
      requests: {cpu: "8", memory: 32Gi, nvidia.com/gpu: 1}
      limits: {cpu: "16", memory: 64Gi, nvidia.com/gpu: 1}
    volumeMounts:
    - {name: hf-cache, mountPath: /hf-cache}
    - {name: shm, mountPath: /dev/shm}
  volumes:
  - name: hf-cache
    hostPath: {path: /home/utec/vllm-estudo/hf-cache, type: DirectoryOrCreate}
  - name: shm
    emptyDir: {medium: Memory, sizeLimit: 8Gi}
